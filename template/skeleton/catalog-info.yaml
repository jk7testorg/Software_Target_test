apiVersion: backstage.io/v1alpha1
kind: Component

metadata:
  name: ${{values.app_name}}
  description: Service ${{values.app_name}}

  annotations:
    github.com/project-slug: jk7testorg/${{values.app_name}}
    backstage.io/techdocs-ref: dir:.
    jenkins.io/job-full-name: jk7test/${{values.app_name | trim}}/main
    argocd/app-name: ${{ values.app_name | lower }}-${{values.app_env}}
    backstage.io/kubernetes-id: ${{values.app_name}}
    sonarqube.org/project-key: ${{ values.app_name | lower }}
    prometheus.io/rule: "container_cpu_usage_seconds_total{pod=~'${{ values.app_name | trim }}.*'}|pod,container_memory_usage_bytes{pod=~'${{ values.app_name | trim }}.*'}|pod"
    prometheus.io/alert: "prometheus.io/alert: "KubePodCrashLooping,KubeDeploymentReplicasMismatch,KubePodNotReady,KubeContainerWaiting,KubeJobFailed"

spec:
  type: service
  owner: development
  lifecycle: experimental

